name: traductor_libros
description: "Visor y editor de los libros SQLite (.db) con traducción por párrafos mediante IA."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0        # Selector de carpetas de Windows
  http: ^1.6.0                # Peticiones al servidor de IA
  json_visualizer: ^0.0.2     # JSON en árbol (capítulos y palabras)
  path: ^1.9.1                # Rutas de archivos
  sqflite_common_ffi: ^2.4.3  # SQLite en escritorio
  trina_grid: ^2.3.0          # Tablas de párrafos y palabras

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
